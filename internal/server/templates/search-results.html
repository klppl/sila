{{define "search-results"}}
{{if .Query}}
<div class="card">
{{if .Results}}
<table>
<thead>
<tr>
<th>Domain</th>
<th>Rule</th>
<th>Source List</th>
<th></th>
</tr>
</thead>
<tbody>
{{range .Results}}
<tr>
<td><code>{{.Domain}}</code></td>
<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.8rem;color:#555;">{{if .Rule}}{{.Rule}}{{else}}||{{.Domain}}^{{end}}</td>
<td>{{.ListName}}</td>
<td>
<button class="btn btn-sm btn-primary"
hx-post="/web/search/whitelist"
hx-vals='{"pattern":"{{.Domain}}"}'
hx-swap="outerHTML"
hx-confirm="Whitelist {{.Domain}}?">Whitelist</button>
</td>
</tr>
{{end}}
</tbody>
</table>
{{else}}
<p style="text-align:center;padding:1.5rem;color:#888;">No results found for <strong>{{.Query}}</strong>.</p>
{{end}}
</div>
{{end}}
{{end}}
